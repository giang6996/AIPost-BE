apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole

metadata:
  name: secrets-store-csi-secret-sync

rules:
  - apiGroups: [""]
    resources:
      - secrets
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding

metadata:
  name: secrets-store-csi-secret-sync

subjects:
  - kind: ServiceAccount
    name: secrets-store-csi-driver
    namespace: aws-secrets-manager

roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: secrets-store-csi-secret-sync